<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="浏览吴磊的作品与影像，查看简介和播放来源。">
  <title>吴磊 · 作品集</title>
  <link rel="stylesheet" href="style.css?v=6">
  <script src="app.js?v=12" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#home"><span>LEO<span class="brand-dot">.</span></span><small>吴磊作品集</small></a>
      <nav id="categories" aria-label="作品分类"></nav>
      <form id="work-search" class="work-search" role="search">
        <input id="search-title" type="search" aria-label="按作品标题搜索" required>
        <button type="submit">搜索</button>
      </form>
    </div>
  </header>
  <main class="shell main">
    <p id="status" role="status">正在载入作品…</p>
    <div id="home" hidden>
      <section id="carousel" class="hero" aria-label="精选作品" aria-roledescription="轮播">
        <div id="slide"></div>
        <div class="hero-controls">
          <button id="prev" type="button" aria-label="上一张">‹</button>
          <button id="next" type="button" aria-label="下一张">›</button>
        </div>
        <div id="dots" class="dots" aria-label="选择精选作品"></div>
      </section>
      <div id="home-sections" hidden></div>
      <section id="work-list" aria-labelledby="list-title">
        <div class="section-title"><h1 id="list-title" tabindex="-1">全部作品</h1><span id="work-count"></span></div>
        <div id="grid" class="grid"></div>
      </section>
    </div>
    <article id="detail" hidden></article>
  </main>
</body>
</html>
